<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">VideoApp 3D communication showcase</title>
  <desc id="desc">A vibrant glassmorphism banner for the VideoApp communication platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130419"/>
      <stop offset="0.45" stop-color="#3B0B66"/>
      <stop offset="0.74" stop-color="#8B146F"/>
      <stop offset="1" stop-color="#006C9C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF72D7"/>
      <stop offset="0.5" stop-color="#9D6CFF"/>
      <stop offset="1" stop-color="#43E7FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF8AE0" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF8AE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03000A" flood-opacity="0.78"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="34" fill="url(#dots)"/>
  <circle cx="1105" cy="215" r="270" fill="url(#halo)" opacity="0.55"/>
  <circle cx="120" cy="80" r="170" fill="#3EE5FF" opacity="0.08"/>
  <path d="M0 410C210 335 430 455 680 388S1100 310 1440 360V480H0Z" fill="#090312" fill-opacity="0.32"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(78 64)">
      <rect width="190" height="38" rx="19" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <circle cx="22" cy="19" r="6" fill="#FF78D8" filter="url(#glow)"/>
      <text x="106" y="25" text-anchor="middle" fill="#FFF0FC" font-size="14" font-weight="800" letter-spacing="2.2">SHYAMRAJ LABS</text>
      <text x="0" y="122" fill="#FFFFFF" font-size="76" font-weight="900" letter-spacing="2">VIDEOAPP</text>
      <rect y="141" width="520" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="2" y="184" fill="#F6E8FF" font-size="24" font-weight="650">Realtime communication across mobile and web</text>
      <text x="2" y="217" fill="#D1BFE2" font-size="18">Messaging · Audio Calls · Video Calls · Admin · Android Releases</text>

      <g transform="translate(0 258)">
        <g><rect width="145" height="48" rx="16" fill="url(#glass)" stroke="#FF79D8" stroke-opacity="0.55"/><text x="72.5" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">NODE.JS API</text></g>
        <g transform="translate(159)"><rect width="175" height="48" rx="16" fill="url(#glass)" stroke="#A77DFF" stroke-opacity="0.55"/><text x="87.5" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">REACT NATIVE</text></g>
        <g transform="translate(348)"><rect width="153" height="48" rx="16" fill="url(#glass)" stroke="#55E8FF" stroke-opacity="0.55"/><text x="76.5" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">SOCKET.IO</text></g>
      </g>
      <text x="2" y="355" fill="#C7AEDA" font-size="14" font-weight="700" letter-spacing="1.5">ANDROID · EXPRESS · MONGODB · REALTIME EVENTS · RELEASE OPS</text>
    </g>

    <g transform="translate(830 44)" filter="url(#shadow)">
      <ellipse cx="245" cy="386" rx="258" ry="38" fill="#08020E" fill-opacity="0.5"/>
      <g transform="translate(148 10) rotate(5 112 190)">
        <rect width="224" height="390" rx="42" fill="#0D091A" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>
        <rect x="14" y="16" width="196" height="358" rx="32" fill="url(#glass)" stroke="#FF99E4" stroke-opacity="0.35"/>
        <rect x="79" y="27" width="66" height="9" rx="4.5" fill="#FFFFFF" opacity="0.32"/>
        <circle cx="112" cy="96" r="38" fill="url(#accent)" opacity="0.95"/>
        <circle cx="99" cy="86" r="11" fill="#FFFFFF" opacity="0.72"/>
        <text x="112" y="157" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">Incoming Call</text>
        <text x="112" y="182" text-anchor="middle" fill="#E3D4EA" font-size="12">Secure realtime connection</text>
        <circle cx="69" cy="282" r="25" fill="#FF4D79"/>
        <path d="M58 281c10 10 14 12 23 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <circle cx="155" cy="282" r="25" fill="#27D991"/>
        <path d="M144 286c10-10 14-12 23 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <rect x="55" y="336" width="114" height="7" rx="3.5" fill="#FFFFFF" opacity="0.22"/>
      </g>

      <g transform="translate(-40 78) rotate(-8 115 70)">
        <rect width="230" height="140" rx="24" fill="url(#glass)" stroke="#55E8FF" stroke-opacity="0.5"/>
        <circle cx="38" cy="39" r="16" fill="#4BE7FF" fill-opacity="0.3" stroke="#8EF2FF"/>
        <rect x="66" y="28" width="112" height="8" rx="4" fill="#FFFFFF" opacity="0.42"/>
        <rect x="66" y="47" width="80" height="7" rx="3.5" fill="#FFFFFF" opacity="0.2"/>
        <rect x="24" y="82" width="168" height="36" rx="18" fill="#3FE4FF" fill-opacity="0.14"/>
        <text x="108" y="105" text-anchor="middle" fill="#F4FFFF" font-size="12" font-weight="800">MESSAGE DELIVERED ✓</text>
      </g>

      <g transform="translate(360 72) rotate(9 105 72)">
        <rect width="210" height="144" rx="24" fill="url(#glass)" stroke="#FF79D8" stroke-opacity="0.5"/>
        <circle cx="54" cy="56" r="25" fill="#FF6FD4" fill-opacity="0.3" stroke="#FFA8E8"/>
        <path d="M45 56l7 7 13-18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="132" y="53" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">Release Ready</text>
        <text x="132" y="77" text-anchor="middle" fill="#E9D6ED" font-size="12">Android build verified</text>
        <rect x="40" y="102" width="132" height="18" rx="9" fill="url(#accent)" opacity="0.7"/>
      </g>

      <g transform="translate(348 250) rotate(-5 110 70)">
        <rect width="220" height="140" rx="24" fill="url(#glass)" stroke="#A77DFF" stroke-opacity="0.55"/>
        <rect x="24" y="25" width="76" height="9" rx="4.5" fill="#B89AFF"/>
        <path d="M28 104L61 80l34 11 38-45 55 31" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="133" cy="46" r="6" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
